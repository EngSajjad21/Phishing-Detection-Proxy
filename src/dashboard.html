<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Proxy Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #38bdf8; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        .log-container { background: #1e293b; border-radius: 8px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .log-entry { font-family: 'Courier New', monospace; padding: 8px; border-bottom: 1px solid #334155; font-size: 0.9em; }
        .log-entry:last-child { border-bottom: none; }
        .blocked { color: #f87171; font-weight: bold; }
        .allowed { color: #4ade80; }
        .timestamp { color: #94a3b8; margin-right: 10px; }
        .refresh-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .refresh-btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Phishing Detection Proxy Dashboard</h1>
        <button class="refresh-btn" onclick="fetchLogs()">Refresh Logs</button>
        <div class="log-container" id="logContainer">
            <p>Loading logs...</p>
        </div>
    </div>

    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const logs = await response.json();
                const container = document.getElementById('logContainer');
                container.innerHTML = '';
                
                if (logs.length === 0) {
                    container.innerHTML = '<p>No logs found.</p>';
                    return;
                }

                logs.reverse().forEach(log => {
                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    
                    let highlightedLog = log;
                    if (log.includes('BLOCKED')) {
                        highlightedLog = log.replace('BLOCKED', '<span class="blocked">BLOCKED</span>');
                    } else if (log.includes('ALLOWED')) {
                        highlightedLog = log.replace('ALLOWED', '<span class="allowed">ALLOWED</span>');
                    }
                    
                    div.innerHTML = highlightedLog;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error('Failed to fetch logs:', err);
            }
        }

        fetchLogs();
        setInterval(fetchLogs, 5000); // Auto-refresh every 5 seconds
    </script>
</body>
</html>
